<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Robot Unit</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root{
    --ink:#2b2620;
    --cream:#f7f2e9;
    --amber:#e0a840;
    --line:rgba(43,38,32,0.18);
  }
  html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  #remoteVideo{width:100%;height:calc(100% - 64px);object-fit:cover;background:#111;display:block;}
  #colorBar{position:fixed;bottom:0;left:0;width:100%;height:64px;background:#000;
    transition:background-color .08s linear;}
  #localVideo{position:fixed;top:14px;right:14px;width:84px;border-radius:10px;
    border:2px solid var(--cream);z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.4);}
  #status{position:fixed;top:14px;left:14px;color:var(--cream);font-size:13px;
    background:rgba(0,0,0,.45);padding:5px 10px;border-radius:20px;z-index:10;letter-spacing:.2px;}
  #idBox{position:fixed;inset:0;background:var(--cream);color:var(--ink);z-index:20;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;
    box-sizing:border-box;text-align:center;}
  #idBox h1{font-size:22px;margin:0 0 4px;font-weight:600;}
  #idBox p{margin:0;font-size:15px;opacity:.75;max-width:280px;line-height:1.4;}
  #peerIdInput{font-size:18px;padding:12px 14px;width:240px;border:1px solid var(--line);
    border-radius:10px;background:#fff;color:var(--ink);text-align:center;}
  #startBtn{font-size:17px;padding:13px 28px;border:none;border-radius:10px;background:var(--ink);
    color:var(--cream);font-weight:600;}
  #startBtn:active{opacity:.8;}
  #errMsg{color:#a33;font-size:13px;min-height:16px;}
</style>
</head>
<body>
  <div id="idBox">
    <h1>Robot unit</h1>
    <p>This is the screen that lives on the robot. Set its ID once, then leave it running.</p>
    <input id="peerIdInput" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button id="startBtn">Start robot unit</button>
    <div id="errMsg"></div>
  </div>

  <video id="remoteVideo" autoplay playsinline></video>
  <video id="localVideo" autoplay playsinline muted></video>
  <div id="colorBar"></div>
  <div id="status">Waiting…</div>

<script>
// Commands understood by the ESP32 and their bar colors.
// Keep these hex values as-is — the ESP32 firmware is tuned to match them.
const COLORS = {
  stop:     '#000000',
  forward:  '#00c853',
  backward: '#d50000',
  left:     '#2962ff',
  right:    '#ffab00'
};

const colorBar   = document.getElementById('colorBar');
const statusEl   = document.getElementById('status');
const remoteVideo= document.getElementById('remoteVideo');
const localVideo = document.getElementById('localVideo');
const idBox      = document.getElementById('idBox');
const peerIdInput= document.getElementById('peerIdInput');
const startBtn   = document.getElementById('startBtn');
const errMsg     = document.getElementById('errMsg');

peerIdInput.value = localStorage.getItem('robotPeerId') || 'family-robot-01';

let peer, localStream, failSafeTimer;

function setColor(cmd){
  colorBar.style.background = COLORS[cmd] || COLORS.stop;
  clearTimeout(failSafeTimer);
  // If no fresh command arrives soon, fail safe back to stop.
  failSafeTimer = setTimeout(() => { colorBar.style.background = COLORS.stop; }, 800);
}

startBtn.addEventListener('click', async () => {
  const id = peerIdInput.value.trim();
  if (!id) return;
  localStorage.setItem('robotPeerId', id);
  idBox.style.display = 'none';
  statusEl.textContent = 'Starting camera…';

  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }, audio: true
    });
    localVideo.srcObject = localStream;
  } catch (err) {
    idBox.style.display = 'flex';
    errMsg.textContent = 'Camera/mic error: ' + err.message;
    return;
  }

  peer = new Peer(id);

  peer.on('open', pid => { statusEl.textContent = 'Ready — ID: ' + pid; });

  peer.on('call', call => {
    call.answer(localStream);
    call.on('stream', stream => {
      remoteVideo.srcObject = stream;
      statusEl.textContent = 'Connected';
    });
    call.on('close', () => {
      statusEl.textContent = 'Call ended';
      remoteVideo.srcObject = null;
      setColor('stop');
    });
  });

  peer.on('connection', conn => {
    conn.on('data', data => { if (data && data.cmd) setColor(data.cmd); });
    conn.on('close', () => setColor('stop'));
  });

  peer.on('error', err => {
    idBox.style.display = 'flex';
    errMsg.textContent = 'Connection error: ' + err.type;
  });

  setColor('stop');
});
</script>
</body>
</html>
